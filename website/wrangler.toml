name = "frozen-fruit-market-entry"
main = "worker.js"
compatibility_date = "2024-04-01"

# Custom Domain Configuration for Cloudflare
routes = [
  { pattern = "krunchies.eurun.eu.org", custom_domain = true }
]

[assets]
directory = "."
binding = "ASSETS"

# D1 Database Binding for Market Survey Data
[[d1_databases]]
binding = "SURVEY_DB"
database_name = "krunchies_survey_db"
database_id = "c9b517a6-ae7e-4245-848f-40e0dc5ea2aa"
