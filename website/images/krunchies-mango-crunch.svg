<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1402 1122" role="img" aria-labelledby="title desc">
  <title id="title">Krunchies Mango Crunch package concept</title>
  <desc id="desc">A comic-book style deep teal Krunchies mango and dark chocolate pouch with thick black outlines and halftone details.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.1" fill="#0b0b0b" opacity=".2"/>
    </pattern>
    <pattern id="tinyDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#fff7e6" opacity=".22"/>
    </pattern>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e5c2"/>
      <stop offset="1" stop-color="#e8d4a2"/>
    </linearGradient>
  </defs>

  <rect width="1402" height="1122" fill="url(#board)"/>
  <rect x="38" y="38" width="1326" height="1046" rx="34" fill="#f1dfb8" stroke="#0b0b0b" stroke-width="10"/>
  <rect x="38" y="38" width="1326" height="1046" rx="34" fill="url(#dots)"/>
  <path d="M120 948 C316 824 410 1015 604 930 S942 842 1122 938 S1275 1001 1317 914" fill="none" stroke="#0b0b0b" stroke-width="14" opacity=".24"/>

  <!-- side panel -->
  <path d="M176 176 L298 142 L298 965 L176 1000 Z" fill="#f07a2b" stroke="#0b0b0b" stroke-width="10"/>
  <path d="M196 242 L274 220 L274 477 L196 499 Z" fill="#fff7e6" stroke="#0b0b0b" stroke-width="6"/>
  <text x="235" y="275" text-anchor="middle" font-family="Impact, Bangers, sans-serif" font-size="30" fill="#0b0b0b">SWEET</text>
  <text x="235" y="312" text-anchor="middle" font-family="Impact, Bangers, sans-serif" font-size="30" fill="#0b0b0b">OUTSIDE</text>
  <text x="235" y="349" text-anchor="middle" font-family="Impact, Bangers, sans-serif" font-size="30" fill="#0b0b0b">SALTY</text>
  <text x="235" y="386" text-anchor="middle" font-family="Impact, Bangers, sans-serif" font-size="30" fill="#0b0b0b">INSIDE!</text>
  <path d="M202 603 C214 566 257 559 273 591 C291 626 265 663 229 663 C200 662 191 634 202 603Z" fill="#f6c945" stroke="#0b0b0b" stroke-width="8"/>
  <path d="M213 606 q22 -16 45 0 q-5 34 -27 37 q-20 -4 -18 -37Z" fill="#f07a2b" stroke="#0b0b0b" stroke-width="6"/>
  <text x="236" y="793" text-anchor="middle" font-family="Impact, Bangers, sans-serif" font-size="25" fill="#0b0b0b">MADE WITH</text>
  <text x="236" y="824" text-anchor="middle" font-family="Impact, Bangers, sans-serif" font-size="25" fill="#0b0b0b">REAL MANGO</text>
  <path d="M207 873 q27 -35 58 0" fill="none" stroke="#0b0b0b" stroke-width="8"/>

  <!-- main package front -->
  <rect x="298" y="142" width="926" height="823" fill="#176b68" stroke="#0b0b0b" stroke-width="10"/>
  <rect x="298" y="142" width="926" height="823" fill="url(#tinyDots)"/>
  <path d="M444 263 L494 209 L550 261 L632 196 L688 264 L770 211 L834 288 L925 233 L985 300 L1088 244 L1146 326 L1191 302 L1140 463 L1182 552 L1103 581 L1143 691 L1037 702 L1012 813 L909 768 L844 851 L772 781 L679 844 L625 761 L516 810 L515 696 L413 678 L465 580 L380 523 L448 451 L406 356 Z" fill="#f6c945" stroke="#0b0b0b" stroke-width="12"/>
  <path d="M414 175 h850 v790 h-850z" fill="url(#dots)" opacity=".65"/>

  <!-- fruit and chocolate pieces -->
  <g stroke="#0b0b0b" stroke-width="8">
    <path d="M399 280 C428 231 502 219 541 261 C572 295 557 344 520 369 C469 404 404 365 399 280Z" fill="#f6c945"/>
    <path d="M1033 239 C1061 204 1121 205 1149 243 C1169 276 1157 316 1123 330 C1081 347 1036 316 1033 239Z" fill="#f07a2b"/>
    <path d="M378 707 C399 648 462 622 512 657 C548 684 548 735 516 772 C472 821 390 796 378 707Z" fill="#f6c945"/>
    <path d="M1058 740 C1073 683 1120 655 1168 679 C1207 699 1214 746 1189 783 C1154 831 1068 809 1058 740Z" fill="#f07a2b"/>
    <path d="M940 359 C981 326 1048 334 1067 379 C1084 421 1055 459 1007 463 C957 466 917 418 940 359Z" fill="#5b2c1c"/>
    <path d="M486 592 C520 550 583 549 607 592 C630 634 600 677 552 682 C502 685 459 636 486 592Z" fill="#5b2c1c"/>
  </g>
  <g fill="none" stroke="#0b0b0b" stroke-width="6" stroke-linecap="round">
    <path d="M422 294 q40 36 84 0"/><path d="M1052 262 q35 29 73 0"/><path d="M401 727 q33 34 74 0"/><path d="M1081 756 q35 28 71 0"/>
    <path d="M455 330 l29 -22 m-14 54 l39 -15 m-113 362 l32 -22 m-5 51 l40 -14"/>
  </g>

  <!-- brand lockup -->
  <text x="758" y="430" text-anchor="middle" font-family="Impact, Bangers, sans-serif" font-size="126" letter-spacing="2" fill="#fff7e6" stroke="#0b0b0b" stroke-width="22" paint-order="stroke">KRUNCHIES</text>
  <text x="758" y="430" text-anchor="middle" font-family="Impact, Bangers, sans-serif" font-size="126" letter-spacing="2" fill="#fff7e6">KRUNCHIES</text>
  <path d="M444 458 Q760 520 1088 456" fill="none" stroke="#0b0b0b" stroke-width="10"/>
  <text x="758" y="570" text-anchor="middle" font-family="Impact, Bangers, sans-serif" font-size="58" fill="#fff7e6" stroke="#0b0b0b" stroke-width="8" paint-order="stroke">MANGO CRUNCH</text>

  <!-- comic accents -->
  <g fill="none" stroke="#0b0b0b" stroke-width="9" stroke-linecap="round">
    <path d="M362 402 l-63 -22 M378 432 l-74 0 M1132 512 l66 -25 M1141 540 l73 7"/>
    <path d="M736 224 l-18 -75 M786 226 l20 -77 M845 247 l47 -63"/>
  </g>
  <path d="M548 705 h420 l-32 88 H584Z" fill="#f07a2b" stroke="#0b0b0b" stroke-width="10"/>
  <text x="758" y="753" text-anchor="middle" font-family="Impact, Bangers, sans-serif" font-size="30" fill="#0b0b0b">DARK CHOCOLATE • SEA SALT FINISH</text>
  <g>
    <rect x="455" y="860" width="230" height="58" rx="29" fill="#fff7e6" stroke="#0b0b0b" stroke-width="7"/>
    <text x="570" y="898" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#0b0b0b">REAL MANGO</text>
    <rect x="725" y="860" width="230" height="58" rx="29" fill="#f6c945" stroke="#0b0b0b" stroke-width="7"/>
    <text x="840" y="898" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#0b0b0b">SEA SALT</text>
    <rect x="995" y="860" width="170" height="58" rx="29" fill="#f07a2b" stroke="#0b0b0b" stroke-width="7"/>
    <text x="1080" y="898" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#0b0b0b">60 G POUCH</text>
  </g>
  <text x="758" y="1018" text-anchor="middle" font-family="Impact, Bangers, sans-serif" font-size="34" fill="#0b0b0b">TROPICAL BITE • TOTALLY KRUNCHY</text>
</svg>
